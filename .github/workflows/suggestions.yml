name: Suggestions du jour

# Lit Bien'ici (et Le Figaro quand il répond), classe les annonces selon les critères
# et publie suggestions.json, affiché dans l'onglet « Suggestions » du site.
#
# GitHub ne garantit pas l'heure des tâches planifiées (retards de plusieurs heures,
# passages sautés). On tente donc toutes les heures à partir de 14 h (heure de Paris) :
# le premier passage de la journée fait la liste, les suivants voient qu'elle est déjà
# faite et s'arrêtent tout de suite.
on:
  schedule:
    - cron: "5 12-21 * * *"   # toutes les heures de 12 h 05 à 21 h 05 UTC
  workflow_dispatch: {}       # bouton « Run workflow » : force une nouvelle liste

permissions:
  contents: write

concurrency:
  group: suggestions
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Faut-il faire la liste ?
        id: go
        run: |
          H=$(TZ=Europe/Paris date +%-H)
          AUJ=$(TZ=Europe/Paris date +%F)
          DERN=$(python3 -c "import json,datetime,zoneinfo;g=json.load(open('suggestions.json'))['genere'];print(datetime.datetime.fromisoformat(g).astimezone(zoneinfo.ZoneInfo('Europe/Paris')).date())" 2>/dev/null || echo aucune)
          echo "Heure à Paris : $H h ; dernière liste : $DERN ; aujourd'hui : $AUJ"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$DERN" = "$AUJ" ]; then echo "Liste du jour déjà faite."
          elif [ "$H" -ge 14 ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "Trop tôt (avant 14 h à Paris)."; fi

      - uses: actions/setup-python@v5
        if: steps.go.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Analyse des annonces
        if: steps.go.outputs.go == '1'
        run: python3 tools/scan.py --site --sans-supabase --out rapport

      - name: Publier les suggestions
        if: steps.go.outputs.go == '1'
        run: |
          git config user.name "suggestions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suggestions.json data/propositions.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Suggestions du $(TZ=Europe/Paris date +%d/%m/%Y)"
          git pull --rebase origin main
          git push
